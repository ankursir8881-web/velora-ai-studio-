<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc6a;stop-opacity:1" />
    </linearGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#0a0a0a"/>
  <!-- Outer glow ring -->
  <rect x="16" y="16" width="480" height="480" rx="64" fill="none" stroke="url(#glow)" stroke-width="4" opacity="0.6" filter="url(#neon)"/>
  <!-- Inner ring -->
  <rect x="32" y="32" width="448" height="448" rx="56" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.3"/>
  <!-- V shape / AI neural symbol -->
  <g transform="translate(256, 220)" filter="url(#neon)">
    <!-- Neural network nodes -->
    <circle cx="-80" cy="-60" r="12" fill="#00ff88" opacity="0.9"/>
    <circle cx="0" cy="-80" r="14" fill="#00ff88" opacity="1"/>
    <circle cx="80" cy="-60" r="12" fill="#00ff88" opacity="0.9"/>
    <circle cx="-60" cy="20" r="10" fill="#00ff88" opacity="0.8"/>
    <circle cx="60" cy="20" r="10" fill="#00ff88" opacity="0.8"/>
    <circle cx="0" cy="60" r="16" fill="#00ff88" opacity="1"/>
    <!-- Connections -->
    <line x1="-80" y1="-60" x2="0" y2="-80" stroke="#00ff88" stroke-width="3" opacity="0.6"/>
    <line x1="80" y1="-60" x2="0" y2="-80" stroke="#00ff88" stroke-width="3" opacity="0.6"/>
    <line x1="-80" y1="-60" x2="-60" y2="20" stroke="#00ff88" stroke-width="2" opacity="0.4"/>
    <line x1="80" y1="-60" x2="60" y2="20" stroke="#00ff88" stroke-width="2" opacity="0.4"/>
    <line x1="0" y1="-80" x2="-60" y2="20" stroke="#00ff88" stroke-width="2" opacity="0.4"/>
    <line x1="0" y1="-80" x2="60" y2="20" stroke="#00ff88" stroke-width="2" opacity="0.4"/>
    <line x1="-60" y1="20" x2="0" y2="60" stroke="#00ff88" stroke-width="3" opacity="0.6"/>
    <line x1="60" y1="20" x2="0" y2="60" stroke="#00ff88" stroke-width="3" opacity="0.6"/>
  </g>
  <!-- Text -->
  <text x="256" y="380" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="42" fill="#ffffff" letter-spacing="2">VELORA</text>
  <text x="256" y="415" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="18" fill="#00ff88" letter-spacing="6">AI STUDIO</text>
</svg>
